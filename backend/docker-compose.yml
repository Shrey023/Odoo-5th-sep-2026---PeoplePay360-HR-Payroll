services:
  db:
    image: postgres:16-alpine
    container_name: peoplepay360-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peoplepay
      POSTGRES_PASSWORD: peoplepay
      POSTGRES_DB: peoplepay360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
